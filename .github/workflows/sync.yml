name: Emir Hub Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kontrol Et
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: İndirme Aracını Kur
        run: pip install --upgrade gdown

      - name: Drive Klasöründen Paketi Çek ve Aç
        run: |
          gdown --folder "https://drive.google.com/drive/folders/1zGownBbhvEktZpOa1P9478fpt0o1nUxG" --remaining-ok
          find . -name "*.zip" -type f -exec unzip -o {} -d . \;

      - name: Değişiklik Varsa GitHub'a Otomatik Yükle
        run: |
          git config --global user.name "EmirHub Bot"
          git config --global user.email "bot@emirhub.local"
          git add index.html _headers netlify.toml 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Auto sync from Google Drive" && git push)
