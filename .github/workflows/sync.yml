name: Emir Hub Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kontrol Et
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: İndirme Aracını Kur
        run: pip install gdown

      - name: Drive Klasöründen En Yeni Paketi Çek
        run: |
          gdown --folder "https://drive.google.com/drive/folders/1zGownBbhvEktZpOa1P9478fpt0o1nUxG" -O ./drive_download --remaining-ok
          NEWEST_ZIP=$(ls -t ./drive_download/*.zip 2>/dev/null | head -1)
          if [ -n "$NEWEST_ZIP" ]; then
            echo "En yeni paket bulundu: $NEWEST_ZIP"
            unzip -o "$NEWEST_ZIP" -d .
            rm -rf ./drive_download
          fi

      - name: Değişiklik Varsa Otomatik Commit ve Push Yap
        run: |
          git config --global user.name "EmirHub Bot"
          git config --global user.email "bot@emirhub.local"
          git add index.html _headers netlify.toml 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Auto sync from Google Drive" && git push)
